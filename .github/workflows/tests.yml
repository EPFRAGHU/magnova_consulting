name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          touch database/database.sqlite
          composer setup
        env:
          # CI has no MySQL server; .env.example points at one, so use a throwaway SQLite file instead.
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      # Same checks as `composer ci:check`, run as separate steps so each failure is easy to read.
      - name: Frontend format and lint
        run: npm run check

      - name: Frontend types
        run: npm run types:check

      - name: PHP code style
        run: composer lint:check

      - name: PHP static analysis
        run: composer types:check

      - name: Tests
        run: |
          php artisan config:clear --ansi
          php artisan test
